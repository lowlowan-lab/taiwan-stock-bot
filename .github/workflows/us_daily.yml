name: US Daily Report Push
on:
  schedule:
    # UTC 23:00 = 台灣隔天 07:00。UTC 週日~週四 = 台灣週一~週五早上。
    # 台灣週一 07:00 recap 美股週五場（週末休市，最新一場就是週五）；
    # 其餘各日 recap 前一個美股交易日。
    # 注意：GitHub cron 是 UTC、不會自動處理美國日光節約時間。
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run US daily report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python us_daily.py
